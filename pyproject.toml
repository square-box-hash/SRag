[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srag"
version = "1.3.10"
description = "Smart RAG — the retrieval layer for local AI agents. Replaces Tavily + Firecrawl + Perplexity with a single open-source package."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Gourav Mandi", email = "mg1139110@gmail.com" }
]
keywords = [
    "rag", "retrieval", "ai", "llm", "agents",
    "search", "scraping", "vector", "lancedb",
    "semantic-search", "chunking",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.8",
    "ddgs>=9.0",
    "lancedb>=0.6",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "playwright>=1.40",
    "lxml>=5.0",
    "cssselect>=1.2",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
]
mcp = [
    "srag[server]",
    "fastapi-mcp>=0.4.0",
    # fastapi-mcp 0.4.x calls mcp.Server(name, version) positionally; the mcp 2.x
    # SDK changed that signature, so the mount dies with a TypeError and the
    # server silently comes up with no MCP endpoint at all.
    "mcp>=1.10,<2",
]
docs = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
databases = [
    "psycopg2-binary>=2.9",
]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0"
]
all = [
    # mcp belongs here: without it a container built from `srag[all]` serves
    # HTTP only and has no /mcp endpoint for an agent to connect to.
    "srag[docs,databases,server,local,mcp]"
]

[project.urls]
Homepage   = "https://github.com/square-box-hash/SRag"
Repository = "https://github.com/square-box-hash/SRag"
Issues     = "https://github.com/square-box-hash/SRag/issues"

[project.scripts]
srag = "srag.cli:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["srag*"]
